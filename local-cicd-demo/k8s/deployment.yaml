apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-cicd-demo
  namespace: demo
  labels:
    app: local-cicd-demo
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-cicd-demo
  template:
    metadata:
      labels:
        app: local-cicd-demo
        version: v1
    spec:
      containers:
        - name: web
          # Placeholder for later Harness Artifact Registry substitution, e.g.
          # <REGISTRY_HOST>/<REPO>/local-cicd-demo:<TAG>. Harness CD will
          # replace this via <+artifacts.primary.image> at deploy time.
          image: REGISTRY_PLACEHOLDER/local-cicd-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
