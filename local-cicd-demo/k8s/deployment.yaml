apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-cicd-demo
  namespace: demo
  labels:
    app: local-cicd-demo
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-cicd-demo
  template:
    metadata:
      labels:
        app: local-cicd-demo
        version: v1
    spec:
      imagePullSecrets:
        - name: local-cicd-demo-dockercfg
      containers:
        - name: web
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
