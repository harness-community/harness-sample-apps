apiVersion: v1
kind: Secret
metadata:
  name: local-cicd-demo-dockercfg
  namespace: demo
  annotations:
    # Harness versions managed Secrets by appending a release suffix. The
    # pull secret is referenced by a stable name from the Deployment, so
    # pin it across releases.
    harness.io/skip-versioning: "true"
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{ .Values.dockercfg }}
