<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello from Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --card: #121a33;
        --accent: #4f8cff;
        --text: #e9eefb;
        --muted: #9aa6c2;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #1e2a55 0%, transparent 60%),
          radial-gradient(900px 500px at 110% 10%, #243a86 0%, transparent 55%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 2.25rem 2rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.01em;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        background: rgba(79, 140, 255, 0.15);
        color: var(--accent);
        font-weight: 600;
        font-size: 0.85rem;
        margin: 0.5rem 0 1rem;
      }
      p { color: var(--muted); margin: 0.25rem 0; }
      .meta {
        margin-top: 1.25rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      code {
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1rem 0.4rem;
        border-radius: 6px;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello from Harness</h1>
      <div class="badge">version v1</div>
      <p>Deployed to local Kubernetes</p>
      <p class="meta">Served by <code>nginx:alpine</code> via a Harness CI/CD pipeline.</p>
    </main>
  </body>
</html>
