name: SBOM pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: lavakush07/easy-buggy-app
  IMAGE_TAG: sbom-pipeline

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: SBOM generation
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: vpCkHKsDSxK9_KYfjCTMKA
          HARNESS_ORG_ID: SSCA
          HARNESS_PROJECT_ID: Exploratory
          HARNESS_API_KEY: ${{ secrets.SCS_API_KEY }}
          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          TOOL: Syft
          FORMAT: spdx-json
          ATTEST: true
          KMS_KEY: cosign

      - name: SBOM verification
        uses: harness/github-actions/sbom-policy-enforcement@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: vpCkHKsDSxK9_KYfjCTMKA
          HARNESS_ORG_ID: SSCA
          HARNESS_PROJECT_ID: Exploratory
          HARNESS_API_KEY: ${{ secrets.SCS_API_KEY }}
          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          VERIFY: true
          POLICY_SET_REF: policy_for_at
          KMS_KEY: cosign
