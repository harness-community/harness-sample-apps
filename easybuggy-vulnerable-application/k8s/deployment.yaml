apiVersion: apps/v1
kind: Deployment
metadata:
  name: easybuggy-vulnerable-application
  labels:
    app: easybuggy-vulnerable-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easybuggy-vulnerable-application
  template:
    metadata:
      labels:
        app: easybuggy-vulnerable-application
    spec:
      containers:
        - name: easybuggy-vulnerable-application
          image: lavakush07/easy-buggy-app:demo1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: easybuggy-vulnerable-application-svc
spec:
  selector:
    app: easybuggy-vulnerable-application
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
