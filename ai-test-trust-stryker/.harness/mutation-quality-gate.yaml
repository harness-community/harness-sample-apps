pipeline:
  name: AI Test Trust - Mutation Quality Gate
  identifier: AI_Test_Trust_Mutation_Quality_Gate
  inputs:
    codebase_branch:
      type: string
      default: feat/ai-test-trust-stryker-lab
      description: Branch of harness-sample-apps to check out
  clone:
    enabled: true
    connector: github_devrel_harness_community
    repo_name: harness-community/harness-sample-apps
    ref:
      type: branch
      name: <+inputs.codebase_branch>
  stages:
    - id: MutationQualityGate
      name: Mutation Quality Gate
      runtime: cloud
      cache:
        enabled: true
      steps:
        - id: setup_hono
          name: Setup Hono + stage tests
          run:
            container:
              image: node:20-bullseye
            shell: bash
            script: |
              cd ai-test-trust-stryker
              bash scripts/setup-hono.sh
        - id: run_vitest
          name: Run Vitest (AI + human + original Buffer tests)
          run:
            container:
              image: node:20-bullseye
            shell: bash
            script: |
              cd ai-test-trust-stryker/.hono
              mkdir -p ../reports
              pnpm exec vitest run src/utils/buffer.ai.eval.test.ts src/utils/buffer.human.test.ts src/utils/buffer.test.ts --config vitest.buffer.config.ts --reporter=default --reporter=junit --outputFile.junit=../reports/junit-vitest.xml
            report:
              type: junit
              paths:
                - ai-test-trust-stryker/reports/junit-vitest.xml
        - id: run_stryker
          name: Run Stryker mutation testing
          run:
            container:
              image: node:20-bullseye
            shell: bash
            script: |
              cd ai-test-trust-stryker/.hono
              pnpm exec stryker run
        - id: quality_gate
          name: Enforce mutation quality gate
          run:
            container:
              image: node:20-bullseye
            shell: bash
            script: |
              cd ai-test-trust-stryker
              bash scripts/check-quality-gate.sh
