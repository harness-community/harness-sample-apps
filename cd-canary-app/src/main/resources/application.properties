server.port=8080
spring.application.name=cd-canary-app

# Expose health + info. Health shows details so probes see per-group status.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# App properties, overridable via APP_VERSION / FAULT_MODE env vars.
app.version=${APP_VERSION:dev}
app.fault-mode=${FAULT_MODE:none}
