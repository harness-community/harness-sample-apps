apiVersion: v1
kind: Secret
metadata:
  name: cd-canary-app-dockercfg
  namespace: {{.Values.namespace}}
  annotations:
    # Harness Canary versions managed workloads/ConfigMaps/Secrets by
    # appending a release suffix. The pull secret is referenced by a stable
    # name from the Deployment, so pin it across releases.
    harness.io/skip-versioning: "true"
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{.Values.dockercfg}}
