apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-canary-app
  namespace: {{.Values.namespace}}
  labels:
    app: cd-canary-app
    version: {{.Values.imageTag}}
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: cd-canary-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cd-canary-app
        version: {{.Values.imageTag}}
    spec:
      imagePullSecrets:
        - name: cd-canary-app-dockercfg
      containers:
        - name: cd-canary-app
          image: {{.Values.image}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # APP_VERSION is baked into the image during docker build, so it
          # is not overridden here. FAULT_MODE stays runtime-configurable.
          env:
            - name: FAULT_MODE
              value: "{{.Values.faultMode}}"
          # Liveness: is the JVM alive? Never flips under fault mode.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: is the pod ready to serve? Never flips under fault mode either.
          # This is intentional — we want v3 to stay Ready so canary verification
          # (not Kubernetes) catches the degradation.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
